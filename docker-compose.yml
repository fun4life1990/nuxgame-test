version: '3.1'
services:
    db:
        image: mariadb:10.3.36
        volumes:
          - ./phpdocker/mysql/data:/var/lib/mysql
        environment:
          MYSQL_DATABASE: ${DB_DATABASE}
          MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
          MYSQL_PASSWORD: ${DB_PASSWORD}
          MYSQL_USER: ${DB_USERNAME}
        ports:
            - '14006:3306'

    web:
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '14000:80'

    app:
        build: phpdocker/php-fpm
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/cli/conf.d/99-overrides.ini'
        environment:
          XDEBUG_CONFIG: client_host=host.docker.internal client_port=${XDEBUG_STORM_PORT} mode=debug
          PHP_IDE_CONFIG: serverName=${XDEBUG_STORM_SERVER_NAME}
